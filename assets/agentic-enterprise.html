const audioCache=new Map();
async function fetchAudio(text){const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}/stream`,{method:"POST",headers:{"xi-api-key":ELEVEN_KEY,"Content-Type":"application/json"},body:JSON.stringify({text,model_id:"eleven_turbo_v2_5",voice_settings:{stability:0.6,similarity_boost:0.8,style:0.3,use_speaker_boost:true}})});if(!r.ok)throw new Error(r.status);return URL.createObjectURL(await r.blob())}

function useNarration(cur,total,goNext){
  const[playing,setPlaying]=useState(false);
  const[auto,setAuto]=useState(false);
  const[loading,setLoading]=useState(false);
  const audioRef=useRef(null);
  const autoRef=useRef(false);
  const curRef=useRef(cur);
  const playRef=useRef(false);
  curRef.current=cur; autoRef.current=auto; playRef.current=playing;

  const stop=useCallback(()=>{if(audioRef.current){audioRef.current.pause();audioRef.current=null}setPlaying(false);setLoading(false)},[]);
  const speak=useCallback(async(idx)=>{
    const text=narrationTexts[idx];if(!text){setPlaying(false);return}
    if(audioRef.current){audioRef.current.pause();audioRef.current=null}
    setLoading(true);
    try{
      let url=audioCache.get(idx);
      if(!url){url=await fetchAudio(text);audioCache.set(idx,url)}
      const nx=idx+1;if(nx<total&&narrationTexts[nx]&&!audioCache.has(nx))fetchAudio(narrationTexts[nx]).then(u=>audioCache.set(nx,u)).catch(()=>{});
      const a=new Audio(url);audioRef.current=a;
      a.onended=()=>{setPlaying(false);audioRef.current=null;if(autoRef.current&&curRef.current<total-1)setTimeout(goNext,1200)};
      a.onerror=()=>{setPlaying(false);setLoading(false)};
      await a.play();setPlaying(true);setLoading(false)
    }catch(e){console.error(e);setPlaying(false);setLoading(false)}
  },[total,goNext]);

  useEffect(()=>{if(playRef.current||autoRef.current){const t=setTimeout(()=>speak(cur),500);return()=>clearTimeout(t)}},[cur]);
  const togglePlay=useCallback(()=>{playing?stop():speak(cur)},[playing,stop,speak,cur]);
  const toggleAuto=useCallback(()=>{if(auto){setAuto(false);stop()}else{setAuto(true);if(!playing)speak(cur)}},[auto,playing,stop,speak,cur]);
  useEffect(()=>()=>{if(audioRef.current)audioRef.current.pause()},[]);
  return{playing,auto,loading,togglePlay,toggleAuto,stop}
}

function Particles({count=50}){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current;if(!c)return;const ctx=c.getContext("2d");
    const resize=()=>{c.width=c.offsetWidth*2;c.height=c.offsetHeight*2};resize();window.addEventListener("resize",resize);
    const ps=Array.from({length:count},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,s:Math.random()*2+1}));
    let id;const draw=()=>{ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fillStyle="rgba(41,181,232,0.4)";ctx.fill()});for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<200){ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.strokeStyle=`rgba(41,181,232,${.15*(1-d/200)})`;ctx.lineWidth=.5;ctx.stroke()}}id=requestAnimationFrame(draw)};draw();
    return()=>{cancelAnimationFrame(id);window.removeEventListener("resize",resize)}
  },[count]);

// ===== APP =====
function App(){
  const initSlide=parseInt(new URLSearchParams(window.location.search).get('slide'))||0;
  const[cur,setCur]=useState(initSlide);
  const[trans,setTrans]=useState(false);
  const[dark,setDark]=useState(true);
  const tRef=useRef(null);
  const goTo=useCallback((i)=>{if(i<0||i>=slides.length||i===cur)return;if(tRef.current)clearTimeout(tRef.current);setTrans(true);tRef.current=setTimeout(()=>{setCur(i);setTrans(false);tRef.current=null},300)},[cur]);
  const next=useCallback(()=>{if(cur<slides.length-1)goTo(cur+1)},[cur,goTo]);
  const prev=useCallback(()=>{if(cur>0)goTo(cur-1)},[cur,goTo]);
  const{playing,auto,loading,togglePlay,toggleAuto}=useNarration(cur,slides.length,next);
  useEffect(()=>{const h=(e)=>{if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();next()}if(e.key==="ArrowLeft"){e.preventDefault();prev()}};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[next,prev]);
  const Slide=slides[cur].C;
  return(
  <div className="h-screen w-screen flex flex-col overflow-hidden" style={{background:"var(--background)",color:"var(--foreground)"}}>
    <div className="h-1 w-full relative z-50" style={{background:"var(--secondary)"}}><div className="h-full transition-all duration-500" style={{width:`${((cur+1)/slides.length)*100}%`,background:"linear-gradient(to right,var(--glow-blue),var(--glow-purple))"}}/></div>
    <main className="flex-1 relative overflow-hidden"><div className={`absolute inset-0 transition-all duration-500 ease-out ${trans?"opacity-0 scale-[0.98]":"opacity-100 scale-100"}`}><Slide/></div></main>
    <nav className="h-16 flex items-center justify-between px-6 shrink-0" style={{borderTop:"1px solid var(--overlay-border)",background:"rgba(var(--background),0.8)",backdropFilter:"blur(8px)"}}>
      <button onClick={prev} disabled={cur===0} className="p-2 rounded-lg disabled:opacity-30 hover:opacity-80 transition-colors"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div className="flex items-center gap-1.5">{slides.map((s,i)=><button key={i} onClick={()=>goTo(i)} title={s.title} className="group relative h-2 rounded-full transition-all duration-300" style={{width:i===cur?32:8,background:i===cur?"var(--primary)":"var(--muted-foreground)",opacity:i===cur?1:0.3}}><span className="absolute -top-8 left-1/2 -translate-x-1/2 text-xs opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none" style={{color:"var(--muted-foreground)"}}>{s.short}</span></button>)}</div>
      <div className="flex items-center gap-3">
        <span className="text-xs opacity-50 tabular-nums">{cur+1}/{slides.length}</span>
        <button onClick={togglePlay} disabled={loading} className="p-2 rounded-lg transition-all" style={{color:playing||loading?"var(--primary)":"inherit",opacity:playing||loading?1:0.6}} title={loading?"Loading...":playing?"Pause":"Play"}>{loading?<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>:playing?<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>:<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>}</button>
        <button onClick={toggleAuto} className="p-2 rounded-lg transition-all" style={{color:auto?"#34d399":"inherit",opacity:auto?1:0.6}} title={auto?"Stop autoplay":"Autoplay"}><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg></button>
        <button onClick={()=>{setDark(!dark);document.documentElement.classList.toggle("dark")}} className="p-2 rounded-lg opacity-60 hover:opacity-80 transition-colors" title="Theme">{dark?<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2m10-10h-2M4 12H2m15.364-5.364l-1.414 1.414M7.05 16.95l-1.414 1.414m12.728 0l-1.414-1.414M7.05 7.05L5.636 5.636"/></svg>:<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>}</button>
        <button onClick={next} disabled={cur===slides.length-1} className="p-2 rounded-lg disabled:opacity-30 hover:opacity-80 transition-colors"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </nav>
  </div>);
}
