<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Data &amp; Context — Cortex Sense</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
:root {
  --brand-primary: #29b5e8;
  --brand-primary-foreground: #fff;
  --background: #f8fafc;
  --foreground: #1e293b;
  --card: #fff;
  --primary: #29b5e8;
  --secondary: #f1f5f9;
  --muted-foreground: #64748b;
  --border: #e2e8f0;
  --glow-blue: #29b5e8;
  --glow-purple: #7d44cf;
  --glow-teal: #11567f;
  --overlay-subtle: #00000005;
  --overlay-medium: #0000000a;
  --overlay-border: #00000014;
  --surface-dim: #f1f5f9;
  --surface-inset: #e8eef4;
  --logo-bg: #0000000a;
  --logo-border: #00000014;
}
.dark {
  --background: #0a0e1a;
  --foreground: #f0f4f8;
  --card: #111827;
  --secondary: #1e293b;
  --muted-foreground: #94a3b8;
  --border: #1e3a5f;
  --glow-purple: #8b5cf6;
  --glow-teal: #14b8a6;
  --overlay-subtle: #ffffff08;
  --overlay-medium: #ffffff0f;
  --overlay-border: #ffffff14;
  --surface-dim: #1a1d21;
  --surface-inset: #111827;
  --logo-bg: #ffffff08;
  --logo-border: #ffffff0f;
}
* { border-color: var(--border); }
body { background: var(--background); color: var(--foreground); -webkit-font-smoothing: antialiased; overflow: hidden; margin: 0; font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; }
.text-gradient-teal { background: linear-gradient(135deg, var(--glow-teal), var(--glow-blue)); -webkit-text-fill-color: transparent; -webkit-background-clip: text; background-clip: text; }
.bg-radial-teal { background: radial-gradient(#14b8a61f 0%, transparent 70%); }
.bg-dots { background-image: radial-gradient(var(--overlay-border) 1px, transparent 1px); background-size: 30px 30px; }
.fade-up { opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.fade-up-delay-1 { animation-delay: 0.15s; }
.fade-up-delay-2 { animation-delay: 0.3s; }
.fade-up-delay-3 { animation-delay: 0.45s; }
@keyframes fadeUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes expandWidth { 0% { width: 0%; } 100% { width: var(--target-width, 100%); } }
.narr-btn { position:fixed; bottom:16px; right:16px; z-index:100; width:44px; height:44px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:rgba(41,181,232,0.15); backdrop-filter:blur(8px); border:1px solid rgba(41,181,232,0.3); transition:all 0.2s; }
.narr-btn:hover { background:rgba(41,181,232,0.25); transform:scale(1.05); }
.narr-btn svg { width:20px; height:20px; color:var(--primary); fill:currentColor; }
</style>
</head>
<body>
<div id="root"></div>
<button class="narr-btn" id="narrBtn" title="Play narration">
  <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
</button>
<script type="text/babel" data-type="module">
const {useState, useEffect, useRef} = React;

const LOGO_CDN = "https://cdn.jsdelivr.net/npm/simple-icons@13/icons/";
const LOGO_MAP = {
  snowflake:"snowflake", postgres:"postgresql", redshift:"amazonredshift",
  databricks:"databricks", tableau:"tableau", dbt:"dbt", confluence:"confluence"
};
const LOGO_COLORS = {
  snowflake:"#29B5E8", postgres:"#4169E1", redshift:"#8C4FFF",
  databricks:"#FF3621", tableau:"#E97627", dbt:"#FF694B", confluence:"#2684FF"
};
const BRAND_LOGOS_FALLBACK = {
  powerbi: {viewBox:"0 0 24 24",fill:"#F2C811",paths:["M10.3 3.3c-.66 0-1.2.54-1.2 1.2v15c0 .66.54 1.2 1.2 1.2h2.4c.66 0 1.2-.54 1.2-1.2v-15c0-.66-.54-1.2-1.2-1.2h-2.4zm-5.4 4.8c-.66 0-1.2.54-1.2 1.2v10.2c0 .66.54 1.2 1.2 1.2h2.4c.66 0 1.2-.54 1.2-1.2V9.3c0-.66-.54-1.2-1.2-1.2H4.9zm10.8 0c-.66 0-1.2.54-1.2 1.2v10.2c0 .66.54 1.2 1.2 1.2h2.4c.66 0 1.2-.54 1.2-1.2V9.3c0-.66-.54-1.2-1.2-1.2h-2.4z"]}
};

function BrandLogo({name,size=22}){
  const cdnName = LOGO_MAP[name];
  const color = LOGO_COLORS[name] || "#fff";
  if(cdnName){
    const url = LOGO_CDN + cdnName + ".svg";
    return <div style={{width:size,height:size,backgroundColor:color,WebkitMaskImage:`url(${url})`,WebkitMaskSize:"contain",WebkitMaskRepeat:"no-repeat",WebkitMaskPosition:"center",maskImage:`url(${url})`,maskSize:"contain",maskRepeat:"no-repeat",maskPosition:"center"}}/>;
  }
  const logo = BRAND_LOGOS_FALLBACK[name];
  if(!logo) return <div className="rounded flex items-center justify-center" style={{width:size,height:size,background:"rgba(148,163,184,0.1)"}}><span className="text-[8px] opacity-60">{(name||'?')[0].toUpperCase()}</span></div>;
  return <svg width={size} height={size} viewBox={logo.viewBox} fill={logo.fill} xmlns="http://www.w3.org/2000/svg">
    {logo.paths&&logo.paths.map((d,i)=><path key={i} d={d}/>)}
  </svg>;
}

const accuracyData = [{name:"Sales",base:8,sense:67,sv:96},{name:"Mktg",base:12,sense:63,sv:63},{name:"Product",base:10,sense:61,sv:97},{name:"Finance",base:9,sense:68,sv:98},{name:"Support",base:11,sense:65,sv:65},{name:"Ops",base:14,sense:62,sv:62},{name:"HR",base:7,sense:60,sv:60},{name:"Partners",base:10,sense:64,sv:64}];

function App(){
  const[mode,setMode]=useState("off");
  return(
  <div className="h-screen w-screen overflow-hidden" style={{background:"var(--background)",color:"var(--foreground)"}}>
  <div className="w-full h-full relative overflow-hidden">
    <div className="absolute inset-0 bg-radial-teal opacity-30"/>
    <div className="absolute inset-0 bg-dots opacity-15"/>
    <div className="relative z-10 w-full h-full flex flex-col items-center justify-center px-6 md:px-12 lg:px-16 py-6">
      <div className="text-center mb-4 fade-up"><h2 className="text-3xl md:text-4xl lg:text-5xl font-bold">With context, data becomes <span className="text-gradient-teal">meaning</span>.</h2></div>
      <div className="w-full max-w-5xl mb-3 fade-up fade-up-delay-1">
        <div className="relative rounded-xl overflow-hidden px-5 py-3" style={{border:"1px solid rgba(20,184,166,0.25)",background:"rgba(20,184,166,0.03)"}}>
          <div className="flex items-center gap-4"><div className="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center" style={{background:"rgba(20,184,166,0.1)"}}><div className="w-4 h-4 rounded" style={{background:"rgba(20,184,166,0.3)"}}/></div><div className="space-y-0.5"><h3 className="text-base font-bold" style={{color:"var(--glow-teal)"}}>Cortex Sense</h3><p className="text-xs opacity-60">Always-on runtime — continuously learning your data landscape</p></div></div>
        </div>
      </div>
      <div className="w-full max-w-5xl grid grid-cols-4 gap-3 fade-up fade-up-delay-2">
        <div className="rounded-xl p-3 space-y-2" style={{border:"1px solid var(--overlay-border)",background:"var(--overlay-subtle)"}}><div className="flex items-center gap-2"><span className="text-[10px] font-mono opacity-50">01</span><span className="text-[9px] uppercase tracking-wider opacity-40">Ecosystem</span></div><h4 className="text-xs font-semibold opacity-70">Connectors</h4><div className="grid grid-cols-4 gap-1.5">{["postgres","redshift","databricks","tableau","powerbi","dbt","confluence"].map(n=><div key={n} className="flex flex-col items-center gap-0.5"><div className="p-1 rounded flex items-center justify-center" style={{background:"var(--logo-bg)",border:"1px solid var(--logo-border)",width:22,height:22}}><BrandLogo name={n} size={16}/></div><span className="text-[7px] opacity-40 capitalize">{n==="powerbi"?"Power BI":n}</span></div>)}</div></div>
        <div className="rounded-xl p-3 space-y-2" style={{border:"1px solid var(--overlay-border)",background:"var(--overlay-subtle)"}}><div className="flex items-center gap-2"><span className="text-[10px] font-mono opacity-50">02</span><span className="text-[9px] uppercase tracking-wider opacity-40">Structured</span></div><h4 className="text-xs font-semibold opacity-70">Structured Knowledge</h4><ul className="space-y-1.5">{["Semantic Views","Lineage & Query Patterns","Schema Metadata"].map(t=><li key={t} className="flex items-center gap-1.5"><div className="w-1 h-1 rounded-full" style={{background:"var(--glow-teal)"}}/><span className="text-[10px] opacity-60">{t}</span></li>)}</ul></div>
        <div className="rounded-xl p-3 space-y-2" style={{border:"1px solid var(--overlay-border)",background:"var(--overlay-subtle)"}}><div className="flex items-center gap-2"><span className="text-[10px] font-mono opacity-50">03</span><span className="text-[9px] uppercase tracking-wider opacity-40">Unstructured</span></div><h4 className="text-xs font-semibold opacity-70">Unstructured Knowledge</h4><ul className="space-y-1.5">{["Cortex Search","SharePoint & Drive MCP","Internal Wikis","Docs & PDFs"].map(t=><li key={t} className="flex items-center gap-1.5"><div className="w-1 h-1 rounded-full" style={{background:"var(--glow-teal)"}}/><span className="text-[10px] opacity-60">{t}</span></li>)}</ul></div>
        <div className="rounded-xl p-3 space-y-2" style={{border:"1px solid var(--overlay-border)",background:"var(--overlay-subtle)"}}><div className="flex items-center gap-2"><span className="text-[10px] font-mono opacity-50">04</span><span className="text-[9px] uppercase tracking-wider opacity-40">Operational</span></div><h4 className="text-xs font-semibold opacity-70">Business Logic</h4><ul className="space-y-1.5">{["Business Glossary (Knowledge Graph)","Reusable Skills"].map(t=><li key={t} className="flex items-center gap-1.5"><div className="w-1 h-1 rounded-full" style={{background:"var(--glow-teal)"}}/><span className="text-[10px] opacity-60">{t}</span></li>)}</ul></div>
      </div>
      <div className="w-full max-w-5xl mt-5 fade-up fade-up-delay-3">
        <div className="rounded-xl p-4" style={{border:"1px solid var(--overlay-border)",background:"var(--surface-dim)"}}>
          <div className="flex items-center gap-2 mb-3">
            <span className="text-[10px] opacity-50 uppercase tracking-wider mr-2">Accuracy</span>
            <button onClick={()=>setMode("off")} className={`px-2.5 py-1 rounded-full text-[10px] font-medium transition-colors ${mode==="off"?"text-white":"opacity-50"}`} style={mode==="off"?{background:"rgba(148,163,184,0.4)"}:{}}> Baseline</button>
            <button onClick={()=>setMode("sense")} className={`px-2.5 py-1 rounded-full text-[10px] font-medium transition-colors ${mode==="sense"?"text-white":"opacity-50"}`} style={mode==="sense"?{background:"var(--glow-teal)"}:{}}> + Cortex Sense</button>
            <button onClick={()=>setMode("sv")} className={`px-2.5 py-1 rounded-full text-[10px] font-medium transition-colors ${mode==="sv"?"text-white":"opacity-50"}`} style={mode==="sv"?{background:"var(--glow-purple)"}:{}}> + Semantic Views</button>
          </div>
          <div className="grid grid-cols-8 gap-2">{accuracyData.map(d=>{
            const base=d.base;const senseBoost=mode!=="off"?d.sense-d.base:0;const svBoost=mode==="sv"?d.sv-d.sense:0;
            return <div key={d.name} className="flex flex-col items-center gap-1">
              <div className="w-full h-24 rounded-md relative overflow-hidden flex flex-col justify-end" style={{background:"var(--overlay-subtle)"}}>
                {svBoost>0&&<div className="w-full transition-all duration-700 ease-out" style={{height:`${svBoost}%`,background:"rgba(139,92,246,0.6)"}}/>}
                {senseBoost>0&&<div className="w-full transition-all duration-700 ease-out" style={{height:`${senseBoost}%`,background:"var(--glow-teal)"}}/>}
                <div className="w-full transition-all duration-700 ease-out" style={{height:`${base}%`,background:"rgba(148,163,184,0.3)"}}/>
              </div>
              <span className="text-[9px] opacity-50">{d.name}</span>
              <span className="text-[10px] font-mono font-medium opacity-70">{mode==="off"?d.base:mode==="sense"?d.sense:d.sv}%</span>
            </div>
          })}</div>
        </div>
      </div>
    </div>
  </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
